<?xml version="1.0" encoding="UTF-8"?>
<!-- BROUILLON PROVISOIRE (M2) — pose `glitch` (échec technique réel).
     Dérivé des tracés de la pose `idle` (docs/design/mascotte-etats.html) :
     corps, bras, joues et couleurs identiques ; l'antenne se plie, la
     feuille pend, une petite étincelle en zigzag signale la panne, les yeux
     sont dépareillés (déboussolés), la bouche une petite ligne neutre.
     Clairement technique, sans suggérer que tout est cassé ni que c'est la
     faute de l'enfant (docs/ui.md, docs/glossaire.md). À remplacer par le
     dessin définitif (dette, docs/jalons.md, M2). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="150" height="150" aria-hidden="true">
  <!-- antenne pliée, feuille qui pend -->
  <path d="M70 46 V36 L80 28" stroke="#2B2140" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <ellipse cx="88" cy="34" rx="15" ry="8" fill="#3FC66B" stroke="#2B2140" stroke-width="4" transform="rotate(38 88 34)"/>
  <!-- étincelle -->
  <path d="M104 14 l-6 8 h7 l-6 9" stroke="#2B2140" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="24" cy="92" rx="12" ry="8" fill="#FFC642" stroke="#2B2140" stroke-width="4" transform="rotate(-22 24 92)"/>
  <ellipse cx="116" cy="92" rx="12" ry="8" fill="#FFC642" stroke="#2B2140" stroke-width="4" transform="rotate(22 116 92)"/>
  <ellipse cx="70" cy="88" rx="46" ry="42" fill="#FFC642" stroke="#2B2140" stroke-width="4"/>
  <!-- yeux dépareillés : un rond, l'autre plus petit et plus haut -->
  <circle cx="56" cy="80" r="7" fill="#2B2140"/>
  <circle cx="58.6" cy="77.4" r="2.4" fill="#FFF6E9"/>
  <circle cx="85" cy="76" r="4.5" fill="#2B2140"/>
  <circle cx="86.6" cy="74.4" r="1.6" fill="#FFF6E9"/>
  <ellipse cx="42" cy="96" rx="7" ry="4.5" fill="#FF5D8F" opacity="0.55"/>
  <ellipse cx="98" cy="96" rx="7" ry="4.5" fill="#FF5D8F" opacity="0.55"/>
  <!-- bouche neutre, légèrement de biais -->
  <path d="M62 101 L78 99" stroke="#2B2140" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
